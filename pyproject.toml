[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recast-diffusion"
version = "0.3.2"
description = "Reward credit assignment across timesteps for diffusion reward fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "diffusers==0.33.1",
  "huggingface-hub>=0.30.0",
  "numpy==1.26.4",
  "peft==0.17.0",
  "Pillow==10.4.0",
  "safetensors>=0.4.5",
  "sentencepiece>=0.2.0",
  "torch==2.6.0",
  "tomli>=2.0.1; python_version < '3.11'",
  "transformers==4.54.0",
]

[project.optional-dependencies]
h200 = [
  "hpsv2x==1.2.0",
  "torchvision==0.21.0",
]
tracking = ["wandb>=0.18.0,<0.20.0"]

[project.urls]
Repository = "https://github.com/yhangchen/ReCAST-code"

[project.scripts]
recast-train = "train_recast:main"

[tool.setuptools]
packages = ["recast"]
py-modules = ["train_recast"]

[tool.setuptools.data-files]
"share/recast/configs" = [
  "configs/h200_8gpu.toml",
  "configs/h200_8gpu_stage2_geneval.toml",
]
"share/recast/scripts" = ["scripts/launch_8xh200.sh"]
"share/recast/slurm" = ["slurm/train_8xh200.sbatch"]
